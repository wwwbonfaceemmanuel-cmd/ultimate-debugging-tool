
name: Build Ultimate Debugging Tool APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Back up custom Android files
        run: |
          mkdir -p /tmp/udt-native-backup

          cp android/app/src/main/AndroidManifest.xml \
            /tmp/udt-native-backup/AndroidManifest.xml

          cp android/app/src/main/kotlin/com/ultimate/debugging/ultimate_debugging_tool/MainActivity.kt \
            /tmp/udt-native-backup/MainActivity.kt

          cp android/app/src/main/kotlin/com/ultimate/debugging/ultimate_debugging_tool/ApplicationInventory.kt \
            /tmp/udt-native-backup/ApplicationInventory.kt

          cp android/app/src/main/res/xml/file_paths.xml \
            /tmp/udt-native-backup/file_paths.xml

      - name: Generate Flutter project
        run: |
          flutter create \
            --platforms=android \
            --org com.ultimate.debugging \
            --project-name ultimate_debugging_tool \
            .

      - name: Restore custom Android files
        run: |
          mkdir -p android/app/src/main/kotlin/com/ultimate/debugging/ultimate_debugging_tool
          mkdir -p android/app/src/main/res/xml

          cp /tmp/udt-native-backup/AndroidManifest.xml \
            android/app/src/main/AndroidManifest.xml

          cp /tmp/udt-native-backup/MainActivity.kt \
            android/app/src/main/kotlin/com/ultimate/debugging/ultimate_debugging_tool/MainActivity.kt

          cp /tmp/udt-native-backup/ApplicationInventory.kt \
            android/app/src/main/kotlin/com/ultimate/debugging/ultimate_debugging_tool/ApplicationInventory.kt

          cp /tmp/udt-native-backup/file_paths.xml \
            android/app/src/main/res/xml/file_paths.xml

      - name: Verify native Android files
        run: |
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/kotlin/com/ultimate/debugging/ultimate_debugging_tool/MainActivity.kt
          test -f android/app/src/main/kotlin/com/ultimate/debugging/ultimate_debugging_tool/ApplicationInventory.kt
          test -f android/app/src/main/res/xml/file_paths.xml

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ultimate-debugging-tool-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          
