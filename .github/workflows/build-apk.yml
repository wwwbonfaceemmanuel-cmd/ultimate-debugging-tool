name: Build Ultimate Debugging Tool APK

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Check, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Read pinned Flutter version
        id: flutter
        run: echo "version=$(cat .flutter-version)" >> "$GITHUB_OUTPUT"

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          channel: stable
          cache: true

      # Optional. Add these four repository secrets to sign every build
      # with the same key, so new versions install over old ones:
      #   SIGNING_KEYSTORE_BASE64, SIGNING_STORE_PASSWORD,
      #   SIGNING_KEY_ALIAS, SIGNING_KEY_PASSWORD
      - name: Set up signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
            {
              echo "storeFile=release.keystore"
              echo "storePassword=$SIGNING_STORE_PASSWORD"
              echo "keyAlias=$SIGNING_KEY_ALIAS"
              echo "keyPassword=$SIGNING_KEY_PASSWORD"
            } > android/key.properties
            echo "Signing with the permanent key from repository secrets."
          else
            echo "::warning title=Temporary signing key::No signing secrets are set, so this APK is signed with a temporary key. It cannot be installed over an earlier build without uninstalling first. See README, section Signing."
          fi

      - name: Get dependencies
        run: |
          mkdir -p /tmp/logs
          set -o pipefail
          flutter pub get 2>&1 | tee /tmp/logs/1-pub-get.log

      - name: Analyze Dart code
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee /tmp/logs/2-analyze.log

      - name: Run Dart tests
        run: |
          set -o pipefail
          flutter test 2>&1 | tee /tmp/logs/3-dart-tests.log

      - name: Build APK
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee /tmp/logs/4-build.log

      - name: Run native engine tests
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest --console=plain 2>&1 | tee /tmp/logs/5-native-tests.log

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: ultimate-debugging-tool-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      # Puts the important lines of a failed step where they are easy to
      # find: the "Annotations" box at the top of the run page.
      - name: Summarise failures
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, os, re

          def emit(title, text):
              text = text[:7000] or 'No output was captured.'
              text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error title={title}::{text}')

          logs = sorted(glob.glob('/tmp/logs/*.log'))
          if logs:
              last = logs[-1]
              lines = open(last, errors='replace').read().splitlines()
              pattern = re.compile(
                  r'^e: |^\s*(error|warning) •|[Ee]rror:|FAILURE|FAILED|What went wrong|'
                  r'Exception|\[E\]|Some tests failed|Expected:|Actual:|\.dart:\d+|\.kt:\d+'
              )
              keep = [l for l in lines if pattern.search(l)]
              emit(os.path.basename(last), '\n'.join((keep or lines)[-70:]))

          for path in glob.glob('android/app/build/test-results/**/*.xml', recursive=True):
              data = open(path, errors='replace').read()
              for match in re.finditer(
                  r'<testcase name="([^"]+)" classname="([^"]+)"[^>]*>\s*<failure message="([^"]*)"', data
              ):
                  name, cls, message = match.groups()
                  emit('Native test failed', f'{cls.split(".")[-1]}.{name}: {message[:1500]}')
          PY
