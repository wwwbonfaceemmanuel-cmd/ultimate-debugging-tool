# One-off helper: generates the standard Flutter project files (Gradle
# build, launcher icons, pubspec) with the same Flutter version the build
# uses and commits them, so the repository becomes a complete project.
# It is removed again once the files are in place.
name: Bootstrap project scaffold (one-off)

on:
  push:
    branches:
      - 'arena/9b29a2b9-ultimate-debugging-tool'
    paths:
      - '.github/workflows/bootstrap-scaffold.yml'

permissions:
  contents: write

jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate missing project files
        run: |
          set -euo pipefail
          flutter --version --machine > /tmp/flutter-version.json
          python3 -c "import json;print(json.load(open('/tmp/flutter-version.json'))['frameworkVersion'])" > .flutter-version
          cat .flutter-version

          flutter create \
            --platforms=android \
            --org com.ultimate.debugging \
            --project-name ultimate_debugging_tool \
            /tmp/scaffold

          rm -f /tmp/scaffold/test/widget_test.dart /tmp/scaffold/README.md
          rm -rf /tmp/scaffold/.idea /tmp/scaffold/.dart_tool /tmp/scaffold/build
          find /tmp/scaffold -name '*.iml' -delete

          # Copy only files the repository does not have yet.
          cp -rn /tmp/scaffold/. .

      - name: Commit project files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "build: add standard Flutter project files" || exit 0
          git push origin HEAD:${{ github.ref_name }}
